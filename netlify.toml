[build]
  publish = "public"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'sha256-4T0HxAQY5NDV3mmaeaS9Dq/WhtxgIjC1fz0kvMW7PJ0='; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
