<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NGO Donation Portal</title>
<meta name="description" content="Donate to verified causes, become a member and download your receipt.">
<meta name="theme-color" content="#0E3B3A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: calm paper background, deep teal ink, marigold used only for the main action. */
:root {
  --ink: #0e3b3a;
  --ink-2: #16504e;
  --gold: #f4a300;
  --gold-d: #d98f00;
  --leaf: #2f7d4f;
  --paper: #f6f7f3;
  --card: #ffffff;
  --line: #dde3da;
  --text: #1c2b29;
  --muted: #5b6b67;
  --danger: #b3261e;
  --ok: #1e7a45;
  --warn: #8a5a00;
  --ok-bg: #e3f4ea;
  --warn-bg: #fff2d6;
  --bad-bg: #fde7e5;
  --radius: 14px;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--paper); color: var(--text);
  font: 16px/1.6 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
img, svg { max-width: 100%; }
a { color: var(--ink-2); }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0 0 .5em; text-wrap: balance; color: var(--ink); }
h1 { font-size: clamp(2rem, 5vw, 3.4rem); font-weight: 800; letter-spacing: -.02em; }
h2 { font-size: clamp(1.5rem, 3vw, 2.1rem); font-weight: 700; letter-spacing: -.01em; }
h3 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0 0 1em; }
.wrap { max-width: 1120px; margin: 0 auto; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.eyebrow { font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--leaf); margin-bottom: .6rem; }
.loading { padding: 4rem 0; text-align: center; color: var(--muted); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 6px; }

/* header */
.site-header { position: sticky; top: 0; z-index: 20; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); background: var(--ink); color: #fff; }
.nav { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 1rem; min-height: 64px; flex-wrap: wrap; padding: .5rem 0; }
.brand { display: flex; align-items: center; gap: .65rem; color: #fff; text-decoration: none; font-family: var(--display); font-weight: 800; font-size: 1.15rem; margin-right: auto; min-width: 0; }
.brand img { width: 40px; height: 40px; object-fit: contain; border-radius: 8px; background: #fff; padding: 2px; }
.brand-mark { width: 40px; height: 40px; border-radius: 10px; background: var(--gold); color: var(--ink); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 24px; height: 24px; }
.brand span { overflow-wrap: anywhere; }
.nav-links { display: flex; align-items: center; gap: .25rem; flex-wrap: wrap; }
.nav-links a, .nav-links button.linklike { color: #e6f0ee; text-decoration: none; padding: .5rem .8rem; border-radius: 999px; font-weight: 600; font-size: .95rem; background: none; border: 0; cursor: pointer; font-family: inherit; }
.nav-links a:hover, .nav-links button.linklike:hover, .nav-links a.on { background: rgba(255,255,255,.12); color: #fff; }
.nav-links a.btn-gold { background: var(--gold); color: #2a1c00; }
.nav-links a.btn-gold:hover { background: var(--gold-d); color: #2a1c00; }
.nav-toggle { display: none; background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 10px; padding: .5rem .8rem; font: inherit; font-weight: 600; cursor: pointer; }
@media (max-width: 760px) {
  .nav-toggle { display: block; }
  .nav-links { display: none; width: 100%; flex-direction: column; align-items: stretch; padding-bottom: .5rem; }
  .nav-links.open { display: flex; }
  .nav-links a, .nav-links button.linklike { text-align: left; }
}

/* buttons & forms */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; border: 2px solid transparent; border-radius: 999px; padding: .7rem 1.35rem; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; transition: transform .08s, background .15s; min-height: 46px; }
.btn:active { transform: translateY(1px); }
.btn-gold { background: var(--gold); color: #2a1c00; }
.btn-gold:hover { background: var(--gold-d); }
.btn-ink { background: var(--ink); color: #fff; }
.btn-ink:hover { background: var(--ink-2); }
.btn-line { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn-line:hover { background: var(--ink); color: #fff; }
.btn-sm { padding: .35rem .85rem; min-height: 36px; font-size: .875rem; }
.btn-danger { background: transparent; color: var(--danger); border-color: var(--danger); }
.btn-danger:hover { background: var(--danger); color: #fff; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
label { display: block; font-weight: 600; font-size: .92rem; margin-bottom: .3rem; }
input, select, textarea { width: 100%; font: inherit; color: var(--text); background: #fff; border: 1.5px solid #c5cfc9; border-radius: 10px; padding: .65rem .8rem; min-height: 46px; }
textarea { min-height: 90px; resize: vertical; }
input[type=checkbox], input[type=radio] { width: auto; min-height: 0; accent-color: var(--ink); }
input:focus, select:focus, textarea:focus { outline: 3px solid rgba(244,163,0,.45); border-color: var(--ink); }
.field { margin-bottom: 1rem; }
.hint { font-size: .85rem; color: var(--muted); margin-top: .3rem; }
.row { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.check { display: flex; gap: .6rem; align-items: flex-start; font-weight: 500; }
.check input { margin-top: .35rem; }
.alert { padding: .8rem 1rem; border-radius: 10px; margin-bottom: 1rem; font-weight: 500; }
.alert.err { background: var(--bad-bg); color: var(--danger); }
.alert.ok { background: var(--ok-bg); color: var(--ok); }
.alert.info { background: var(--warn-bg); color: var(--warn); }

/* surfaces */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.4rem; min-width: 0; }
.section { padding: 3rem 0; }
.section-head { max-width: 640px; margin-bottom: 1.75rem; }

/* hero */
.hero { background: var(--ink); color: #fff; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 3.5rem max(16px, env(safe-area-inset-right, 0px)) 3.5rem max(16px, env(safe-area-inset-left, 0px)); overflow: hidden; }
.hero-in { max-width: 1120px; margin: 0 auto; display: grid; gap: 2.5rem; grid-template-columns: 1.1fr .9fr; align-items: center; }
.hero h1 { color: #fff; }
.hero p.lead { font-size: 1.15rem; color: #cfe3df; max-width: 52ch; }
.hero .actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.5rem; }
.hero .btn-line { color: #fff; border-color: rgba(255,255,255,.6); }
.hero .btn-line:hover { background: #fff; color: var(--ink); }
.hero-art { background: var(--ink-2); border-radius: 22px; padding: 1rem; }
.hero-art svg { width: 100%; height: auto; display: block; border-radius: 14px; }
@media (max-width: 820px) { .hero-in { grid-template-columns: 1fr; } .hero { padding-top: 2.5rem; padding-bottom: 2.5rem; } }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-top: -2rem; position: relative; }
.stat { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 1.1rem 1.25rem; box-shadow: 0 8px 24px rgba(14,59,58,.08); }
.stat b { display: block; font-family: var(--display); font-size: 1.9rem; color: var(--ink); line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: .9rem; }

/* causes */
.grid { display: grid; gap: 1.1rem; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.cause { display: flex; flex-direction: column; gap: .6rem; text-decoration: none; color: inherit; padding: 0; overflow: hidden; transition: box-shadow .15s, transform .15s; }
.cause:hover { box-shadow: 0 10px 28px rgba(14,59,58,.12); transform: translateY(-2px); }
.cause-top { height: 130px; background: #e8efe9; color: var(--ink); display: grid; place-items: center; background-size: cover; background-position: center; }
.cause-top svg { width: 64px; height: 64px; }
.cause-body { padding: 0 1.2rem 1.2rem; display: flex; flex-direction: column; gap: .4rem; flex: 1; }
.cause-body p { color: var(--muted); font-size: .94rem; margin: 0; flex: 1; }
.cause-foot { display: flex; justify-content: space-between; align-items: center; margin-top: .5rem; font-weight: 700; font-size: .9rem; color: var(--ink-2); }
.pill { display: inline-block; padding: .15rem .65rem; border-radius: 999px; font-size: .78rem; font-weight: 700; }
.pill.approved { background: var(--ok-bg); color: var(--ok); }
.pill.pending { background: var(--warn-bg); color: var(--warn); }
.pill.rejected { background: var(--bad-bg); color: var(--danger); }

.steps { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); counter-reset: s; }
.step { position: relative; padding-left: 3.2rem; }
.step::before { counter-increment: s; content: counter(s); position: absolute; left: 0; top: 0; width: 2.3rem; height: 2.3rem; border-radius: 50%; background: var(--gold); color: #2a1c00; font-weight: 800; display: grid; place-items: center; font-family: var(--display); }

.quote-band { background: var(--ink); color: #fff; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 3rem max(16px, env(safe-area-inset-right, 0px)) 3rem max(16px, env(safe-area-inset-left, 0px)); text-align: center; }
.quote-band blockquote { margin: 0 auto; max-width: 760px; font-family: var(--display); font-size: clamp(1.35rem, 3vw, 2rem); line-height: 1.3; font-weight: 700; }

/* donate layout */
.donate-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .75fr); gap: 1.5rem; align-items: start; }
@media (max-width: 880px) { .donate-grid { grid-template-columns: 1fr; } }
.pick { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.pick label { margin: 0; cursor: pointer; }
.pick input { position: absolute; opacity: 0; pointer-events: none; }
.pick .opt { display: flex; align-items: center; gap: .65rem; border: 1.5px solid var(--line); border-radius: 12px; padding: .65rem .8rem; background: #fff; font-weight: 600; }
.pick .opt svg { width: 28px; height: 28px; flex: none; color: var(--ink-2); }
.pick input:checked + .opt { border-color: var(--ink); background: #eaf2ee; box-shadow: inset 0 0 0 1px var(--ink); }
.pick input:focus-visible + .opt { outline: 3px solid var(--gold); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .75rem; }
.chip { border: 1.5px solid #c5cfc9; background: #fff; border-radius: 999px; padding: .4rem 1rem; font: inherit; font-weight: 700; cursor: pointer; min-height: 40px; font-variant-numeric: tabular-nums; }
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.qr-card { text-align: center; }
.qr-box { background: #fff; border: 2px dashed var(--line); border-radius: 14px; padding: .8rem; margin: .5rem auto 1rem; max-width: 300px; }
.qr-box img { display: block; width: 100%; height: auto; border-radius: 6px; }
.qr-empty { padding: 2rem 1rem; color: var(--muted); font-size: .92rem; }
.upi { display: flex; gap: .5rem; align-items: center; justify-content: center; flex-wrap: wrap; font-weight: 700; }
.upi code { background: #eef3ee; padding: .25rem .6rem; border-radius: 8px; overflow-wrap: anywhere; }
.thanks { text-align: center; max-width: 640px; margin: 2rem auto; }
.thanks .badge { width: 84px; height: 84px; border-radius: 50%; background: var(--ok-bg); color: var(--ok); display: grid; place-items: center; margin: 0 auto 1rem; }
.thanks .badge svg { width: 44px; height: 44px; }
.thanks blockquote { font-family: var(--display); font-size: 1.3rem; font-weight: 700; color: var(--ink); margin: 1.25rem 0; }

/* membership */
.plans { display: grid; gap: 1.1rem; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.plan { display: flex; flex-direction: column; gap: .5rem; }
.plan .price { font-family: var(--display); font-size: 2.2rem; font-weight: 800; color: var(--ink); line-height: 1; }
.plan ul { padding-left: 1.1rem; margin: .5rem 0 1rem; flex: 1; color: var(--muted); }
.plan.best { border: 2px solid var(--ink); }

/* tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th, td { padding: .65rem .85rem; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: #eef3ee; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.actions-cell { display: flex; gap: .4rem; flex-wrap: wrap; }

/* admin */
.tabs { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1.5rem; border-bottom: 1px solid var(--line); padding-bottom: .75rem; }
.tabs a { padding: .5rem 1rem; border-radius: 999px; text-decoration: none; font-weight: 700; color: var(--ink-2); }
.tabs a.on { background: var(--ink); color: #fff; }
.tabs a:hover:not(.on) { background: #e3ebe5; }
.bars { display: grid; gap: .6rem; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 200px) 1fr auto; gap: .75rem; align-items: center; font-size: .9rem; }
.bar-track { background: #e6ede7; border-radius: 99px; height: 14px; overflow: hidden; }
.bar-fill { background: var(--ink); height: 100%; border-radius: 99px; min-width: 2px; }
.daily { display: flex; align-items: flex-end; gap: 6px; height: 160px; padding-top: 1rem; }
.daily .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; min-width: 0; font-size: .68rem; color: var(--muted); gap: 4px; }
.daily .col i { display: block; width: 100%; background: var(--gold); border-radius: 5px 5px 0 0; min-height: 2px; }
.edit-card { margin-bottom: 1rem; }
.edit-card summary { cursor: pointer; font-weight: 700; display: flex; justify-content: space-between; gap: 1rem; align-items: center; list-style: none; }
.edit-card summary::-webkit-details-marker { display: none; }
.edit-card[open] summary { margin-bottom: 1rem; }
.preview { max-width: 180px; max-height: 180px; border: 1px solid var(--line); border-radius: 10px; background: #fff; padding: 4px; display: block; margin-bottom: .5rem; }
.toolbar { display: flex; gap: .75rem; flex-wrap: wrap; align-items: end; margin-bottom: 1rem; }
.toolbar > div { flex: 1 1 160px; min-width: 0; }

/* receipt */
.receipt { background: #fff; border: 2px solid var(--ink); border-radius: 6px; max-width: 760px; margin: 1.5rem auto; padding: 2rem; position: relative; }
.receipt-head { display: flex; gap: 1rem; align-items: center; border-bottom: 2px solid var(--ink); padding-bottom: 1rem; margin-bottom: 1.25rem; }
.receipt-head img { width: 72px; height: 72px; object-fit: contain; }
.receipt-head h2 { margin: 0; }
.receipt-head p { margin: 0; font-size: .85rem; color: var(--muted); }
.receipt dl { display: grid; grid-template-columns: 160px 1fr; gap: .5rem 1rem; margin: 0 0 1.25rem; }
.receipt dt { color: var(--muted); font-weight: 600; }
.receipt dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.receipt .amount { font-family: var(--display); font-size: 2rem; font-weight: 800; color: var(--ink); }
.receipt .thought { border-left: 4px solid var(--gold); padding: .5rem 1rem; margin: 1.25rem 0; font-style: italic; background: #fffaf0; }
.receipt .stamp { position: absolute; right: 1.5rem; top: 5.5rem; transform: rotate(-8deg); border: 3px solid; padding: .15rem .8rem; border-radius: 8px; font-family: var(--display); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.receipt .stamp.approved { color: var(--ok); }
.receipt .stamp.pending { color: var(--warn); }
.receipt .stamp.rejected { color: var(--danger); }
.receipt .sign { display: flex; justify-content: space-between; margin-top: 2.5rem; font-size: .85rem; color: var(--muted); gap: 1rem; flex-wrap: wrap; }
.receipt .sign div { border-top: 1px solid var(--muted); padding-top: .3rem; min-width: 160px; text-align: center; }
@media (max-width: 560px) { .receipt dl { grid-template-columns: 1fr; gap: 0; } .receipt dt { margin-top: .6rem; } .receipt .stamp { position: static; display: inline-block; transform: none; margin-bottom: 1rem; } }

/* footer & toast */
.site-footer { background: #0a2c2b; color: #bcd3cf; margin: 3rem calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0; padding: 2.5rem max(16px, env(safe-area-inset-right, 0px)) 2rem max(16px, env(safe-area-inset-left, 0px)); font-size: .92rem; }
.site-footer .in { max-width: 1120px; margin: 0 auto; display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.site-footer h3 { color: #fff; font-size: 1rem; }
.site-footer a { color: #e6f0ee; }
.site-footer p { margin: 0 0 .4rem; overflow-wrap: anywhere; }
.toast { position: fixed; left: 50%; bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: .75rem 1.25rem; border-radius: 999px; z-index: 50; font-weight: 600; max-width: calc(100vw - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.25); }

@media print {
  body { background: #fff; padding: 0; }
  .site-header, .site-footer, .no-print, .toast { display: none !important; }
  .receipt { border-width: 2px; margin: 0 auto; box-shadow: none; }
  .section { padding: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header class="site-header" id="siteHeader"></header>
<main id="app" tabindex="-1"><p class="loading">Loading…</p></main>
<footer class="site-footer" id="siteFooter"></footer>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
(() => {
  /* ================= state & helpers ================= */
  const S = { pub: null, me: null };
  const D = { dept: null, plan: null };
  const AF = { status: '', kind: '', q: '' };
  const $ = (s, el = document) => el.querySelector(s);
  const appEl = $('#app');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const inr = n => '₹' + Number(n || 0).toLocaleString('en-IN');
  const fmtDate = t => new Date(t).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
  const fmtDateTime = t => new Date(t).toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const app = html => { appEl.innerHTML = html; window.scrollTo(0, 0); };

  async function api(path, opts = {}) {
    const init = { method: opts.method || 'GET', credentials: 'same-origin', headers: {} };
    if (opts.body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(opts.body); }
    let r;
    try { r = await fetch('/api' + path, init); } catch { throw new Error('Cannot reach the server. Check your internet connection.'); }
    let data = {};
    try { data = await r.json(); } catch { /* ignore */ }
    if (!r.ok) throw new Error(data.error || 'Something went wrong. Please try again.');
    return data;
  }
  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
  }
  const alertBox = (msg, kind = 'err') => `<div class="alert ${kind}" role="alert">${esc(msg)}</div>`;

  function words(n) {
    n = Math.floor(n);
    if (n === 0) return 'Zero';
    const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
    const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
    const two = x => (x < 20 ? ones[x] : tens[Math.floor(x / 10)] + (x % 10 ? ' ' + ones[x % 10] : ''));
    const three = x => { let s = ''; if (x >= 100) { s = ones[Math.floor(x / 100)] + ' Hundred'; x %= 100; if (x) s += ' '; } return s + (x ? two(x) : ''); };
    const out = [];
    const cr = Math.floor(n / 1e7); n %= 1e7;
    const lk = Math.floor(n / 1e5); n %= 1e5;
    const th = Math.floor(n / 1e3); n %= 1e3;
    if (cr) out.push(three(cr) + ' Crore');
    if (lk) out.push(two(lk) + ' Lakh');
    if (th) out.push(two(th) + ' Thousand');
    if (n) out.push(three(n));
    return out.join(' ');
  }

  /* resize an uploaded image in the browser so the database stays small */
  function readImage(file, maxPx, mime) {
    return new Promise((resolve, reject) => {
      if (!file || !/^image\/(png|jpeg|webp|gif)$/.test(file.type)) return reject(new Error('Please choose a PNG, JPG or WebP image.'));
      const fr = new FileReader();
      fr.onerror = () => reject(new Error('Could not read that file.'));
      fr.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('That image could not be opened.'));
        img.onload = () => {
          const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
          const ctx = c.getContext('2d');
          if (mime === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
          ctx.drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL(mime, 0.88));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  async function submitPayment(form, kind) {
    const err = $('#formErr', form), btn = $('button[type=submit]', form);
    err.innerHTML = '';
    const fd = new FormData(form);
    const body = { kind, utr: String(fd.get('utr') || '').trim(), message: String(fd.get('message') || ''), anonymous: fd.get('anonymous') === 'on' };
    if (kind === 'donation') {
      const d = deptById(D.dept), amt = Number(fd.get('amount'));
      body.department_id = D.dept; body.amount = amt;
      if (!Number.isInteger(amt) || amt < d.min_amount) { err.innerHTML = alertBox(`Please enter a whole amount of at least ${inr(d.min_amount)}.`); return; }
    } else body.plan_id = D.plan;
    if (!/^[A-Za-z0-9]{6,30}$/.test(body.utr)) { err.innerHTML = alertBox('Please enter the UPI reference number (UTR) from your payment. Letters and digits only.'); return; }
    btn.disabled = true; btn.textContent = 'Submitting…';
    try {
      const r = await api('/pay', { method: 'POST', body });
      S.me = r.user; renderHeader();
      await loadPublic();
      pageThanks(r.payment);

  async function submitAuth(form, mode) {
    const err = $('#formErr', form), btn = $('button[type=submit]', form);
    err.innerHTML = '';
    const body = Object.fromEntries(new FormData(form));
    btn.disabled = true;
    try {
      const r = await api('/' + mode, { method: 'POST', body });
      S.me = r.user; renderHeader();
      const next = sessionStorage.getItem('next'); sessionStorage.removeItem('next');
      toast(mode === 'register' ? 'Account created. Welcome!' : 'Logged in.');
      location.hash = next && next !== '#/login' && next !== '#/register' ? next : '#/dashboard';
    } catch (e) { err.innerHTML = alertBox(e.message); btn.disabled = false; }
  }

            <div class="card"><h3>Logo</h3><p class="muted small">Shown in the top bar and on receipts. A square PNG works best.</p>

  /* ================= events ================= */
  const actions = {
    'nav-toggle': el => { const l = $('#navLinks'); const o = l.classList.toggle('open'); el.setAttribute('aria-expanded', o); },
    logout: async () => { await api('/logout', { method: 'POST' }); S.me = null; renderHeader(); toast('You are logged out.'); location.hash = '#/'; },
    chip: el => { $('#amount').value = el.dataset.v; updateAmount(); },
    copy: async el => { try { await navigator.clipboard.writeText(el.dataset.v); toast('Copied.'); } catch { toast('Copy failed. Please select the text and copy it.'); } },
    print: () => window.print(),
    'filter-pending': () => { AF.status = 'pending'; AF.kind = ''; AF.q = ''; },
    'pay-status': async el => {
      try { await api('/admin/payments/' + el.dataset.id, { method: 'PATCH', body: { status: el.dataset.s } }); toast(el.dataset.s === 'approved' ? 'Payment approved.' : 'Payment rejected.'); await loadPublic(); route(); }
      catch (e) { toast(e.message); }
    },
    'toggle-role': async el => {
      try { await api('/admin/users/' + el.dataset.id, { method: 'PATCH', body: { role: el.dataset.r } }); toast('Role updated.'); route(); } catch (e) { toast(e.message); }
    },
    'reset-pw': async el => {
      const inp = $('#pw-' + el.dataset.id);
      try { await api('/admin/users/' + el.dataset.id, { method: 'PATCH', body: { password: inp.value } }); inp.value = ''; toast('Password changed. The user has been logged out everywhere.'); } catch (e) { toast(e.message); }
    },
    'clear-img': el => {
      const form = el.closest('form'), t = el.dataset.target;
      form.elements[t].value = '';
      const pv = $(`[data-preview="${t}"]`, form); if (pv) { pv.hidden = true; pv.removeAttribute('src'); }
    },
    'del-dept': async el => {
      if (el.dataset.sure !== '1') { el.dataset.sure = '1'; el.textContent = 'Click again to confirm'; return; }
      try { const r = await api('/admin/departments/' + el.dataset.id, { method: 'DELETE' }); toast(r.hidden ? 'This cause has donations, so it was hidden instead of deleted.' : 'Cause deleted.'); await loadPublic(); route(); } catch (e) { toast(e.message); }
    },
    'del-plan': async el => {
      if (el.dataset.sure !== '1') { el.dataset.sure = '1'; el.textContent = 'Click again to confirm'; return; }
      try { const r = await api('/admin/plans/' + el.dataset.id, { method: 'DELETE' }); toast(r.hidden ? 'This plan has members, so it was hidden instead of deleted.' : 'Plan deleted.'); await loadPublic(); route(); } catch (e) { toast(e.message); }
    }
  };
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (el && actions[el.dataset.action]) actions[el.dataset.action](el, e);
    if (!e.target.closest('.nav')) { const l = $('#navLinks'); if (l) l.classList.remove('open'); }
  });
  document.addEventListener('input', e => { if (e.target.matches('[data-input="amount"]')) updateAmount(); });
  document.addEventListener('change', async e => {
    const t = e.target;
    if (t.matches('[data-change="pick-dept"]')) { D.dept = Number(t.value); renderAmount(); }
    else if (t.matches('[data-change="file"]')) {
      const form = t.closest('form'), name = t.dataset.target;
      try {
        const url = await readImage(t.files[0], Number(t.dataset.max), t.dataset.mime);
        form.elements[name].value = url;
        const pv = $(`[data-preview="${name}"]`, form); if (pv) { pv.src = url; pv.hidden = false; }
        toast('Image ready. Press Save to apply it.');
      } catch (er) { toast(er.message); t.value = ''; }
    }
  });

  const forms = {
    donate: f => submitPayment(f, 'donation'),
    member: f => submitPayment(f, 'membership'),
    login: f => submitAuth(f, 'login'),
    register: f => submitAuth(f, 'register'),
    profile: async f => {
      const err = $('#formErr', f);
      try { const r = await api('/me', { method: 'PUT', body: Object.fromEntries(new FormData(f)) }); S.me = r.user; renderHeader(); err.innerHTML = alertBox('Saved.', 'ok'); }
      catch (e) { err.innerHTML = alertBox(e.message); }
    },
    'admin-filter': f => { const d = Object.fromEntries(new FormData(f)); AF.status = d.status; AF.kind = d.kind; AF.q = d.q.trim(); route(); },
    settings: async f => {
      const err = $('#formErr', f);
      const d = Object.fromEntries(new FormData(f));
      d.auto_approve = f.elements.auto_approve.checked ? '1' : '0';
      try { await api('/admin/settings', { method: 'PUT', body: d }); await loadPublic(); renderHeader(); renderFooter(); toast('Settings saved.'); route(); }
      catch (e) { err.innerHTML = alertBox(e.message); window.scrollTo(0, document.body.scrollHeight); }
    },
    dept: async f => {
      const fd = new FormData(f), body = Object.fromEntries(fd); body.active = fd.get('active') === 'on';
      const id = f.dataset.id, err = $('[data-err]', f);
      try { await api('/admin/departments' + (id ? '/' + id : ''), { method: id ? 'PUT' : 'POST', body }); toast(id ? 'Cause saved.' : 'Cause added.'); await loadPublic(); route(); }
      catch (e) { err.innerHTML = alertBox(e.message); }
    },
    plan: async f => {
      const fd = new FormData(f), body = Object.fromEntries(fd); body.active = fd.get('active') === 'on';
      const id = f.dataset.id, err = $('[data-err]', f);
      try { await api('/admin/plans' + (id ? '/' + id : ''), { method: id ? 'PUT' : 'POST', body }); toast(id ? 'Plan saved.' : 'Plan added.'); await loadPublic(); route(); }
      catch (e) { err.innerHTML = alertBox(e.message); }
    }
  };
  document.addEventListener('submit', e => {
    const f = e.target.closest('form[data-form]');
    if (!f) return;
    e.preventDefault();
    if (forms[f.dataset.form]) forms[f.dataset.form](f);
  });

  /* ================= router ================= */
  async function route() {
    const [page = '', arg, arg2] = location.hash.replace(/^#\/?/, '').split('/');
    renderHeader();
    try {
      switch (page || 'home') {
        case 'home': return await pageHome();
        case 'donate': await loadPublic().catch(() => {}); return pageDonate(arg);
        case 'membership': await loadPublic().catch(() => {}); return pageMembership(arg);
        case 'donors': return await pageDonors();
        case 'about': return pageAbout();
        case 'login': return authPage('login');
        case 'register': return authPage('register');
        case 'dashboard': return await pageDashboard();
        case 'receipt': return await pageReceipt(arg);
        case 'admin': return await pageAdmin(arg);
        default: return app('<section class="section wrap"><h1>Page not found</h1><p><a href="#/">Go to the home page</a></p></section>');
      }
    } catch (e) {
      app(`<section class="section wrap">${alertBox(e.message)}<p><a href="#/">Go to the home page</a></p></section>`);
    }
  }
  window.addEventListener('hashchange', route);

  (async () => {
    try {
      await Promise.all([loadPublic(), loadMe()]);
      renderFooter();
      await route();
    } catch (e) {
      appEl.innerHTML = `<section class="section wrap"><div class="alert err">${esc(e.message)}</div></section>`;
    }
  })();
})();
</script>
</body>
</html>
